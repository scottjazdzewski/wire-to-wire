name: WTW Full 1999 Browser World Acceptance
on:
  pull_request:
    paths:
      - 'public/1999/engine/fictional-industry-*.mjs'
      - 'public/1999/engine/shared-1999-career-package.mjs'
      - 'public/1999/engine/fictional-world-name-engine.mjs'
      - 'public/1999/engine/personnel-name-engine.mjs'
      - 'public/next/1999-commercial-career-manager.mjs'
      - 'public/assets/careers/**'
      - 'public/next/1999-track-program.mjs'
      - 'scripts/1999-full-world-browser-cdp.mjs'
      - 'tests/shared-1999-career-package.test.mjs'
      - '.github/workflows/1999-full-world-browser.yml'
  workflow_dispatch:
jobs:
  full-world-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installed Chromium
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Verify portable full-world career checkpoint format
        run: node --test tests/shared-1999-career-package.test.mjs
      - name: Generate, reopen, and inspect full 1999 industry in real Chromium IndexedDB
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p dist/shared-career
          CHROME="$CHROME" WTW_PLAYABLE_WORLD_ONLY=1 WTW_SHARED_CAREER_EXPORT_PATH="$GITHUB_WORKSPACE/dist/shared-career/WTW_1999_FULL_WORLD_SHARED_CAREER.wtwcareer" node scripts/1999-full-world-browser-cdp.mjs | tee full-world-browser.log
          grep -q 'WTW_FULL_WORLD_FIRST_OPEN_PASS' full-world-browser.log
          grep -q 'WTW_FULL_WORLD_PLAYABLE_RACE_PASS' full-world-browser.log
          grep -q 'WTW_FULL_WORLD_RACE_REOPEN_PASS' full-world-browser.log
          grep -q 'WTW_SHARED_CAREER_EXPORT_PASS' full-world-browser.log
          grep -q 'WTW_FULL_WORLD_BROWSER_REOPEN_PASS' full-world-browser.log
          test -s dist/shared-career/WTW_1999_FULL_WORLD_SHARED_CAREER.wtwcareer
      - name: Save full-world browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtw-full-1999-world-browser-evidence
          path: |
            full-world-browser.log
            dist/shared-career/WTW_1999_FULL_WORLD_SHARED_CAREER.wtwcareer
          retention-days: 14
          if-no-files-found: warn
