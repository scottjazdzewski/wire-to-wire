name: Wire to Wire Windows Desktop EXE

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'public/next/**'
      - 'public/1999/**'
      - 'public/assets/careers/**'
      - 'scripts/windows-desktop-smoke.ps1'
      - 'scripts/windows-desktop-visible.ps1'
      - 'scripts/build-wtw-desktop-icon.py'
      - 'scripts/prepare-wtw-desktop-release.mjs'
      - 'tests/desktop-latest-release.test.mjs'
      - 'tests/desktop-g1-local-content.test.cjs'
      - '.github/workflows/windows-desktop-exe.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'public/next/**'
      - 'public/1999/**'
      - 'public/assets/careers/**'
      - 'scripts/windows-desktop-smoke.ps1'
      - 'scripts/windows-desktop-visible.ps1'
      - 'scripts/build-wtw-desktop-icon.py'
      - 'scripts/prepare-wtw-desktop-release.mjs'
      - 'tests/desktop-latest-release.test.mjs'
      - 'tests/desktop-g1-local-content.test.cjs'
      - '.github/workflows/windows-desktop-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-executable:
    name: Portable EXE and Windows Installer
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - name: Check out one authoritative Wire to Wire game
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use Python for build-time icon conversion only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare approved application icon from official game artwork
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/build-wtw-desktop-icon.py
          if(!(Test-Path desktop/assets/wtw-app.ico)){throw "Windows application icon missing"}
      - name: Validate one offline app protocol and source-backed G1 shell
        shell: pwsh
        run: |
          node --test tests/desktop-g1-local-content.test.cjs tests/desktop-latest-release.test.mjs tests/desktop-bundled-career.test.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/local-content.cjs
      - name: Install development-only Electron packager dependencies
        shell: pwsh
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Package unsigned portable EXE and conventional setup EXE
        shell: pwsh
        working-directory: desktop
        run: npm run build:windows
      - name: Confirm both distinct Windows executables exist
        shell: pwsh
        run: |
          $setup=Get-ChildItem dist/windows -Filter 'WireToWire-Setup-*.exe' | Select-Object -First 1
          $portable=Get-ChildItem dist/windows -Filter 'WireToWire-Portable-*.exe' | Select-Object -First 1
          $unpacked='dist/windows/win-unpacked/Wire to Wire.exe'
          if(!$setup -or !$portable -or !(Test-Path $unpacked)){
            Get-ChildItem dist/windows -Recurse | Select-Object FullName,Length
            throw 'Portable, Setup and unpacked app are all required'
          }
          Write-Host "WTW_DESKTOP_BOTH_EXE_TARGETS_PASS"
          $folderZip=Get-ChildItem dist/windows -Filter 'WireToWire-NoInstall-Folder-*.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          $targets=@($setup,$portable,$folderZip) | Where-Object { $_ }
          foreach($file in $targets){
            Write-Host ("WTW_PACKAGE_SIZE {0} {1:N2} MiB ({2} bytes)" -f $file.Name,($file.Length/1MB),$file.Length)
          }
          $unpackedBytes=(Get-ChildItem 'dist/windows/win-unpacked' -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("WTW_PACKAGE_SIZE win-unpacked {0:N2} MiB ({1} bytes)" -f ($unpackedBytes/1MB),$unpackedBytes)
          $recursivePackage='dist/windows/win-unpacked/resources/app.asar.unpacked/node_modules/wtw-canon-desk'
          if(Test-Path -LiteralPath $recursivePackage){
            throw "The desktop package recursively embeds the repository build output: $recursivePackage"
          }
          $asarEntries=@(& node -e 'const asar=require("./desktop/node_modules/@electron/asar"); console.log(asar.listPackage("dist/windows/win-unpacked/resources/app.asar").join("\n"))')
          if($LASTEXITCODE -ne 0){throw 'Could not inspect the packaged app.asar'}
          if($asarEntries -match 'node_modules[/\\]wtw-canon-desk[/\\]'){
            throw 'The desktop app.asar contains the repository package recursively'
          }
      - name: Run real desktop process twice without installed game or remote browser
        shell: pwsh
        run: |
          ./scripts/windows-desktop-smoke.ps1 -Executable (Resolve-Path 'dist/windows/win-unpacked/Wire to Wire.exe').Path -EvidenceDir (Join-Path $PWD 'dist/evidence') -TargetLabel 'unpacked'
      - name: Run portable EXE directly with no installation and verify reopen
        shell: pwsh
        run: |
          $portable=Get-ChildItem dist/windows -Filter 'WireToWire-Portable-*.exe' | Select-Object -First 1
          ./scripts/windows-desktop-smoke.ps1 -Executable $portable.FullName -EvidenceDir (Join-Path $PWD 'dist/portable-evidence') -TargetLabel 'portable' -IncludeCareerBootstrap
      - name: Install the setup EXE and test installed launch with app networking blocked
        shell: pwsh
        run: |
          $setup=Get-ChildItem dist/windows -Filter 'WireToWire-Setup-*.exe' | Select-Object -First 1
          if(!$setup){throw 'Conventional Windows setup EXE is missing'}
          $installDir=Join-Path $PWD 'dist/wtw-installed'
          $installer=Start-Process -FilePath $setup.FullName -ArgumentList @('/S',"/D=$installDir") -PassThru -Wait
          if($installer.ExitCode -ne 0){throw "Silent setup install failed: exit=$($installer.ExitCode)"}
          $installedExe=Join-Path $installDir 'Wire to Wire.exe'
          if(!(Test-Path -LiteralPath $installedExe)){throw "Installed game executable missing: $installedExe"}
          Get-Process -Name 'Wire to Wire' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $ruleName='WTW-Offline-Installed-Smoke-'+$PID
          $ruleCreated=$false
          $evidenceDir=Join-Path $PWD 'dist/installed-offline-evidence'
          try{
            New-NetFirewallRule -Name $ruleName -DisplayName 'WTW installed offline smoke' -Direction Outbound -Program $installedExe -Action Block -Profile Any | Out-Null
            $ruleCreated=$true
            $rule=Get-NetFirewallRule -Name $ruleName
            $filter=Get-NetFirewallApplicationFilter -AssociatedNetFirewallRule $rule
            if($rule.Direction -ne 'Outbound' -or $rule.Action -ne 'Block' -or
               [IO.Path]::GetFullPath($filter.Program) -ine [IO.Path]::GetFullPath($installedExe)){
              throw 'Outbound firewall block does not target the installed game executable'
            }
            ./scripts/windows-desktop-smoke.ps1 -Executable $installedExe -EvidenceDir $evidenceDir -TargetLabel 'installed-offline'
            $proof=[ordered]@{
              result='PASS'
              setupExe=$setup.Name
              installationExitCode=$installer.ExitCode
              installedExecutable=$installedExe
              networkRestriction='WINDOWS_FIREWALL_OUTBOUND_BLOCK_FOR_APP_EXE'
              firewallRule=$ruleName
              firewallProgram=$filter.Program
              writeProof=(Get-Content -Raw (Join-Path $evidenceDir 'installed-offline-write.json') | ConvertFrom-Json)
              reopenProof=(Get-Content -Raw (Join-Path $evidenceDir 'installed-offline-read.json') | ConvertFrom-Json)
            }
            $proof | ConvertTo-Json -Depth 10 | Set-Content -Path (Join-Path $evidenceDir 'installed-offline-install.json') -Encoding utf8
            Write-Host 'WTW_WINDOWS_INSTALLED_OFFLINE_REOPEN_PASS'
          }finally{
            if($ruleCreated){Remove-NetFirewallRule -Name $ruleName -ErrorAction SilentlyContinue}
          }
      - name: Verify actual desktop window is visible and capture a screenshot
        shell: pwsh
        run: |
          ./scripts/windows-desktop-visible.ps1 -Executable (Resolve-Path 'dist/windows/win-unpacked/Wire to Wire.exe').Path -EvidenceDir (Join-Path $PWD 'dist/visible-evidence')
      - name: Package folder-based portable option without a self-extracting wrapper
        shell: pwsh
        run: |
          $version=node -p "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8')).version"
          $target="dist/windows/WireToWire-NoInstall-Folder-$version-x64.zip"
          Compress-Archive -Path 'dist/windows/win-unpacked' -DestinationPath $target -CompressionLevel Optimal -Force
          if(!(Test-Path $target)){throw 'No-install folder ZIP is missing'}
          $folderZip=Get-Item -LiteralPath $target
          Write-Host ("WTW_PACKAGE_SIZE {0} {1:N2} MiB ({2} bytes)" -f $folderZip.Name,($folderZip.Length/1MB),$folderZip.Length)
          Write-Host "WTW_WINDOWS_FOLDER_BASED_NO_INSTALL_PASS $target"
      - name: Preserve the Windows setup installer separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WireToWire-Windows-Setup
          path: dist/windows/WireToWire-Setup-*.exe
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the self-extracting portable build separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WireToWire-Windows-Portable
          path: dist/windows/WireToWire-Portable-*.exe
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the folder-based portable build separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WireToWire-Windows-NoInstall
          path: dist/windows/WireToWire-NoInstall-Folder-*.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve packaged Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WireToWire-Windows-Real-Launch-QA
          path: |
            dist/evidence/*.json
            dist/portable-evidence/*.json
            dist/installed-offline-evidence/*.json
            dist/visible-evidence/*.json
            dist/visible-evidence/*.png
          if-no-files-found: warn
          retention-days: 14

  publish-verified-latest:
    name: Publish Latest Verified Windows EXEs
    needs: windows-executable
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: wtw-desktop-publish-latest
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the exact version that passed Windows tests
        uses: actions/checkout@v4
      - name: Publish only when no newer successfully verified EXE has already been released
        id: current
        shell: bash
        run: |
          set -euo pipefail
          # Continuous engineering moves main frequently. The newest VALIDATED
          # build can be published even if newer untested commits exist.
          # Never replace a later successful release with an older build.
          previous_sha="$(gh release view --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          if [[ "$previous_sha" =~ ^[a-f0-9]{40}$ ]]; then
            relation="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$previous_sha" --jq '.status')"
            case "$relation" in
              ahead|identical)
                echo "Already published an equally new or newer tested revision: $previous_sha"
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              behind)
                echo "A newer verified release is eligible to replace $previous_sha"
                ;;
              *)
                echo "::error::Published release is not on same ordered history; refusing an unsafe update: $relation"
                exit 1
                ;;
            esac
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
      - name: Download the successfully tested EXEs
        if: steps.current.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          name: WireToWire-Windows-Setup
          path: incoming
      - name: Add the successfully tested portable EXE
        if: steps.current.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          name: WireToWire-Windows-Portable
          path: incoming
      - name: Add the successfully tested folder-based portable build
        if: steps.current.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          name: WireToWire-Windows-NoInstall
          path: incoming
      - name: Verify package contents and assign permanent filenames
        if: steps.current.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-wtw-desktop-release.mjs incoming release-assets "$GITHUB_SHA" "$GITHUB_RUN_ID"
          ls -lh release-assets
          {
            echo '# Wire to Wire — Latest Windows Desktop Test Build'
            echo
            echo '**UNSIGNED DEVELOPMENT BUILD — NOT READY FOR COMMERCIAL SALE.**'
            echo
            echo "Git commit: $GITHUB_SHA"
            echo
            echo "GitHub Actions build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Editable source archive for this exact tested build: https://github.com/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.zip"
            echo
            echo 'Portable EXE, setup EXE and faster-starting no-install folder ZIP share one game.'
            echo
            echo 'This release is from the newest fully tested published build. Unmerged changes are never included.'
            echo
            echo 'G2 complete offline historical data and G3 desktop-authoritative career storage are unfinished. Keep backups of your career saves.'
            echo
            echo 'This is not a code-signed retail release.'
          } > release-notes.md
      - name: Create, verify and publish the complete latest Windows release
        if: steps.current.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="desktop-test-run$GITHUB_RUN_NUMBER-$(echo "$GITHUB_SHA" | cut -c1-12)"
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Wire to Wire Desktop Test Build — Run $GITHUB_RUN_NUMBER" \
            --notes-file release-notes.md \
            --draft
          names="$(gh release view "$tag" --json assets --jq '[.assets[].name] | sort | join(",")')"
          expected="$(printf '%s\n' 'SHA256SUMS.txt' 'WTW-Latest-Build-Info.json' 'WireToWire-NoInstall-Latest.zip' 'WireToWire-Portable-Latest.exe' 'WireToWire-Setup-Latest.exe' | sort | paste -sd, -)"
          if [[ "$names" != "$expected" ]]; then
            echo "::error::Unverified or incomplete release: $names"
            exit 1
          fi
          # Only after all five assets exist may the stable URL switch over.
          gh release edit "$tag" --draft=false --latest
          echo "WTW_LATEST_PORTABLE https://github.com/$GITHUB_REPOSITORY/releases/latest/download/WireToWire-Portable-Latest.exe"
          echo "WTW_LATEST_INSTALLER https://github.com/$GITHUB_REPOSITORY/releases/latest/download/WireToWire-Setup-Latest.exe"
          echo "WTW_LATEST_FOLDER https://github.com/$GITHUB_REPOSITORY/releases/latest/download/WireToWire-NoInstall-Latest.zip"
