name: WTW 1999 source integration

on:
  pull_request:
    paths:
      - "src/1999/**"
      - "public/1999/**"
      - "public/index.html"
      - "public/next/index.html"
      - "public/next/1999-bootstrap.js"
      - "public/next/1999-ui-source.mjs"
      - "public/next/next.js"
      - "scripts/1999-management-browser-smoke.sh"
      - "src/worker.js"
      - "tests/1999-*.test.mjs"
      - "src/game/**"
      - ".github/workflows/1999-source-integration.yml"
  push:
    branches:
      - main
      - "fix/1999-browser-population-20261111"

jobs:
  january-1999-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source world and protected entry syntax
        run: |
          node --check src/1999/opening-world.v1.mjs
          node --check src/1999/entry-gate.mjs
          node --check src/1999/test-clock.mjs
          node --check public/1999/test-clock.mjs
          node --check public/next/1999-bootstrap.js
          node --check public/next/1999-ui-source.mjs
          node --check public/next/next.js
          node --check src/worker.js
      - name: Source and browser JavaScript syntax
        run: |
          node --check public/1999/engine/canon-mini.mjs
          node --check public/1999/engine/attribute-catalog.mjs
          node --check public/1999/engine/local-api.mjs
          node --check public/1999/engine/founding-world-1999.mjs
          node --check public/next/1999-commercial-career-manager.mjs
          node --check public/next/1999-commercial-config.js
      - name: Gameplay registration and barn-residence regression
        run: node --test tests/1999-game-horse-registration.test.mjs tests/1999-racing-site-residence.test.mjs
      - name: Jan 1 source and OFFLINE browser population verification
        run: node --test tests/1999-opening-world.test.mjs tests/1999-entry-gate.test.mjs tests/1999-test-clock.test.mjs tests/1999-management-ui-restore.test.mjs tests/1999-management-screen-data.test.mjs tests/1999-founding-world.test.mjs tests/1999-approved-only-world.test.mjs

  management-1999-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved management UI boots with 1999 data in Chromium
        run: bash scripts/1999-management-browser-smoke.sh
      - name: Save browser probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtw-1999-management-browser-qa
          path: visual-audit/1999/
          retention-days: 7
          if-no-files-found: warn


  naming-v12-indexeddb-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify V12 fictional naming persistence in real Chromium IndexedDB
        run: bash scripts/1999-naming-indexeddb-smoke.sh
      - name: Preserve IndexedDB naming browser probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtw-naming-v12-indexeddb-qa
          path: visual-audit/1999/naming-v12-indexeddb-dom.txt
          retention-days: 7
          if-no-files-found: warn
