name: Desktop-First Commercial PR Contract

# Keep only the newest check for EACH PR and EACH workflow.
# Preserve running main branch verification and serialized Windows releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  desktop-offline-compatibility:
    name: Desktop Offline Compatibility Declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out merged PR with full diff history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require local-runtime declaration and reject new hosted gameplay dependencies
        run: node scripts/desktop-first-pr-gate.mjs
