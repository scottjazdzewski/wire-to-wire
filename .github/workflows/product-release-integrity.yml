name: WTW Product-Wide Release Integrity

# Every engineering window, every pull request. No file/path-based exclusions.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 0'

permissions:
  contents: read

jobs:
  product-invariants:
    name: All Assets, One UI, 10000 Exact Reopens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every visual asset, one UI, one save authority and 10,000 serialization cycles
        run: node --test tests/product-release-protections.test.mjs tests/product-lifecycle-10000.test.mjs
      - name: Authoritative engine matches real browser modules
        run: node scripts/sync-1999-browser-gameplay.mjs --check
      - name: Protect earlier approved screens and commands from resurrection
        run: |
          node --test tests/no-legacy-screen-regression.test.mjs tests/ui-uniformity-lock.test.mjs tests/1999-track-profile-layout-lock.test.mjs tests/1999-no-legacy-pilot-profile-overlay.test.mjs tests/1999-founder-logo-activation.test.mjs tests/office-direct-command-bridge.test.mjs

  real-browser-reopen:
    name: Real Chromium Process Exit and Restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm real Chromium is available
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Verify the same saved career and same interface survive real process restarts
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            export WTW_BROWSER_RESTARTS=12
          else
            export WTW_BROWSER_RESTARTS=3
          fi
          node scripts/product-browser-restart-certification.mjs | tee product-restart-certification.log
          grep -q 'WTW_PRODUCT_RESTART_CERTIFICATION_PASS' product-restart-certification.log
      - name: Retain the exact startup and persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtw-product-browser-restart-evidence
          path: product-restart-certification.log
          retention-days: 30
          if-no-files-found: warn
