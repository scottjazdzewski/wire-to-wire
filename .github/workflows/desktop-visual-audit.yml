name: Desktop Visual Audit
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/desktop-visual-audit.sh'
      - 'scripts/manager-v2-visual-audit.sh'
      - '.github/workflows/desktop-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Chrome availability
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Capture and inspect WTW desktop routes
        run: bash scripts/desktop-visual-audit.sh
      - name: Capture clean-sheet Management Studio V2 screens (only while legacy V2 is served)
        run: |
          if grep -qiE 'http-equiv="refresh"|location\.replace\(' public/manager/index.html; then
            echo 'Legacy /manager/ redirects to the active /next/ Office; obsolete V2 screenshots are not applicable.'
          else
            bash scripts/manager-v2-visual-audit.sh
          fi
      - name: Upload screenshots and captured DOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtw-fm-ootp-desktop-screens
          path: visual-audit/
          retention-days: 14
          if-no-files-found: warn
