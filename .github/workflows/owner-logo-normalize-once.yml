name: One-time approved owner logo artwork normalization
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/normalize_owner_logo_art.py'
      - '.github/workflows/owner-logo-normalize-once.yml'
permissions:
  contents: write
jobs:
  standardize-reviewed-owner-logos:
    if: >-
      github.head_ref == 'art/normalize-owner-art-7ed6774' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling for BUILD-TIME ONLY
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Produce genuine before/after QA sheet from 31 approved original blobs
        run: python scripts/normalize_owner_logo_art.py --mode preview --preview-dir /tmp/wtw-owner-art-proof
      - name: Retain visual proof and diagnostics for review
        uses: actions/upload-artifact@v4
        with:
          name: wtw-31-logo-frame-proof
          path: /tmp/wtw-owner-art-proof/
          retention-days: 14
      - name: Write exact 256-square normalized PNGs and update image SHA lock
        run: python scripts/normalize_owner_logo_art.py --mode write --preview-dir /tmp/wtw-owner-art-proof
      - name: Verify reproducibility against original approved blobs
        run: python scripts/normalize_owner_logo_art.py --mode verify --preview-dir /tmp/wtw-owner-art-proof
      - name: Commit only generated artworks, source audit and visual lock to THIS PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/office/founding-organization-logos/O-*.png \
            ops/owner-logo-frame-v1.json ops/approved-visual-assets.lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize 31 approved owner logo artwork frames to identical 256px ivory rounded border'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi