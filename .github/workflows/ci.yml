name: WTW Canon Desk checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source and access tests
        run: npm test
      - name: Check site and API JavaScript syntax
        run: |
          node --check public/app.js
          node --check src/worker.js
      - name: Build private historical import
        run: npm run db:build:full
      - name: Verify historical SQL against temporary SQLite database
        run: python3 scripts/verify-history-sql.py